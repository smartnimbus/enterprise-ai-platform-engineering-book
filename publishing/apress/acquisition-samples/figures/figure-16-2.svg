<text x="655" y="304" font-size="14" text-anchor="middle" font-weight="bold">No call</text>
<text x="12" y="310" font-size="13" text-anchor="start">Decision: required_scope=FAIL | context_conflict_precondition=FAIL</text>
<text x="12" y="328" font-size="13" text-anchor="start">human_execution_approval=ABSENT | SCOPE_EXCEEDS_DELEGATION</text>
<text x="12" y="346" font-size="13" text-anchor="start">MF-EVD-AU-001: token=null | MF-EVD-DN-001: zero financial mutations</text>
<text x="12" y="362" font-size="13" text-anchor="start">Policy evaluator is a logical responsibility, not a registered service.</text></g></svg>
