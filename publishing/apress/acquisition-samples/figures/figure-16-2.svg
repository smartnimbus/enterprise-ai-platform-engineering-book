<text x="360" y="194" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">returns DENY</text>
<polyline points="301,235 537,235" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="419" y="227" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">records decision</text>
<polyline points="301,268 183,268" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
