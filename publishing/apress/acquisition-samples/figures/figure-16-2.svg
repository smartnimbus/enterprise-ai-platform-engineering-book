<text x="419" y="72.5" font-size="14" text-anchor="middle">evaluator</text>
<polyline points="419,78 419,287" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="484" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="537" y="57.5" font-size="14" text-anchor="middle">Evidence</text>
<text x="537" y="72.5" font-size="14" text-anchor="middle">store</text>
