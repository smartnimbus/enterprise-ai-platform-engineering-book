<polyline points="65,103 183,103" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="124" y="95" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">proposes refund</text>
<polyline points="183,136 301,136" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="242" y="128" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">requests mutation</text>
