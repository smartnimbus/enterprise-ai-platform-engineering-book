<rect x="248" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="301" y="57.5" font-size="14" text-anchor="middle">Gateway</text>
<text x="301" y="72.5" font-size="14" text-anchor="middle">PEP</text>
