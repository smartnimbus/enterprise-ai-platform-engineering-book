<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="title desc"><title id="title">Figure 16-2. Gateway evaluation and denied decision</title><desc id="desc">The refund service proposes a mutation, but the Gateway enforcement point receives a denial from the policy evaluator and records the decision. No execution token or external ledger request is issued.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#171717">
<text x="12" y="24" font-size="17" text-anchor="start" font-weight="bold">Figure 16-2  |  Gateway evaluation and denied decision</text>
<rect x="12" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="65" y="65" font-size="14" text-anchor="middle">Agent</text>
<polyline points="65,78 65,287" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
