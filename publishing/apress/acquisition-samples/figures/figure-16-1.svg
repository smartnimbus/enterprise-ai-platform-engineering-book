<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346" role="img" aria-labelledby="title desc"><title id="title">Figure 16-1. Scope attenuation before action admission</title><desc id="desc">A human delegates a read-and-request workflow through an agent and refund service to the Gateway enforcement point. The Gateway denies refund execution because the effective permission is narrower than the required action scope.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#171717">
<text x="12" y="24" font-size="17" text-anchor="start" font-weight="bold">Figure 16-1  |  Scope attenuation before action admission</text>
<rect x="12" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="65" y="65" font-size="14" text-anchor="middle">Human</text>
<polyline points="65,78 65,250" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="159.5" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="212.5" y="65" font-size="14" text-anchor="middle">Agent</text>
<polyline points="212.5,78 212.5,250" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="307" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="360" y="57.5" font-size="14" text-anchor="middle">Refund</text>
<text x="360" y="72.5" font-size="14" text-anchor="middle">service</text>
<polyline points="360,78 360,250" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="454.5" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="507.5" y="65" font-size="14" text-anchor="middle">Gateway PEP</text>
<polyline points="507.5,78 507.5,250" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<rect x="602" y="42" width="106" height="36" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="655" y="65" font-size="14" text-anchor="middle">Refund tool</text>
<polyline points="655,78 655,250" fill="none" stroke="#333" stroke-width="0.8" stroke-dasharray="5 4"/>
<polyline points="65,105 212.5,105" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="138.75" y="97" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">delegates read/request</text>
<polyline points="212.5,143 360,143" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="286.25" y="135" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">delegates request</text>
<polyline points="360,181 507.5,181" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="433.75" y="173" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">requests action</text>
<text x="507.5" y="205" font-size="13" text-anchor="middle">evaluates scope</text>
<polyline points="507.5,231 360,231" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="433.75" y="223" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">denies execution</text>
<text x="655" y="266" font-size="14" text-anchor="middle" font-weight="bold">Not invoked</text>
<text x="12" y="282" font-size="15" text-anchor="start" font-weight="bold">Effective: refund:request | Required: refund:execute | DENY</text>
<text x="12" y="300" font-size="13" text-anchor="start">MF-EVD-DG-001 | MF-EVT-009 to MF-EVT-012 | Unsigned synthetic claims</text>
<text x="12" y="316" font-size="13" text-anchor="start">Human: MF-HUM-RET-017 | Agent: MF-AGT-RET-004 | Service: MF-SVC-REF-002</text>
<text x="12" y="332" font-size="13" text-anchor="start">PEP: MF-SVC-PEP-001 | Refund tool: MF-TOOL-REF-001</text></g></svg>
