<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-labelledby="title desc"><title id="title">Figure 13-2. Semantic Reconciliation Workflow</title><desc id="desc">Two authorised records match the same product and effective time but disagree on status. The reconciliation workflow retains UNRESOLVED and escalates to the Retail Data Steward without selecting either value.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#333"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#171717">
<text x="12" y="24" font-size="17" text-anchor="start" font-weight="bold">Figure 13-2  |  Semantic Reconciliation Workflow</text>
<rect x="20" y="65" width="190" height="43" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="115" y="91.5" font-size="14" text-anchor="middle">Candidate claims</text>
<rect x="260" y="65" width="190" height="43" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="355" y="91.5" font-size="14" text-anchor="middle">Identity matched</text>
<rect x="500" y="65" width="190" height="43" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="595" y="91.5" font-size="14" text-anchor="middle">Time aligned</text>
<rect x="500" y="157" width="190" height="43" rx="1" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="595" y="183.5" font-size="14" text-anchor="middle">Conflict detected</text>
<rect x="260" y="157" width="190" height="43" rx="1" fill="#e6e6e6" stroke="#333" stroke-width="1.5"/>
<text x="355" y="183.5" font-size="14" text-anchor="middle" font-weight="bold">UNRESOLVED</text>
<rect x="20" y="157" width="190" height="43" rx="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<text x="115" y="183.5" font-size="14" text-anchor="middle">Steward escalation</text>
<polyline points="210,86 260,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="235" y="55" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">match ID</text>
<polyline points="450,86 500,86" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="475" y="55" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">align time</text>
<polyline points="595,108 595,157" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="645" y="135" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">compare status</text>
<polyline points="500,178 450,178" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="475" y="147" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">retain conflict</text>
<polyline points="260,178 210,178" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
<text x="235" y="147" font-size="12" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="3" stroke-linejoin="round">escalate</text>
<text x="20" y="219" font-size="13" text-anchor="start">MF-PROD-0091 | Same effective time: 2027-02-22 00:00 UTC | ACTIVE / CLOSED</text>
<text x="20" y="236" font-size="13" text-anchor="start">No precedence defined | MF-EVD-RC-001 | MF-EVT-007 / MF-EVT-008</text>
<text x="20" y="253" font-size="13" text-anchor="start">Retail Data Steward: MF-HUM-RET-OWN-001 | No durable eligibility assertion</text></g></svg>
