<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 413" role="img" aria-labelledby="title desc"><title id="title">Seven-step business-case appraisal</title><desc id="desc">Seven steps lead to business case, option ADR and benefits register.</desc><rect width="340" height="413" fill="white"/><g font-family="sans-serif"><rect x="24" y="5" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="24" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="28" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">1</text><text x="181" y="28" font-size="12" text-anchor="middle" fill="#20252b">Confirm funded demand</text><path d="M170 44 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="60" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="79" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="83" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">2</text><text x="181" y="83" font-size="12" text-anchor="middle" fill="#20252b">Establish equivalent requirements</text><path d="M170 99 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="115" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="134" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="138" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">3</text><text x="181" y="138" font-size="12" text-anchor="middle" fill="#20252b">Identify eligible alternatives</text><path d="M170 154 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="170" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="189" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="193" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">4</text><text x="181" y="193" font-size="12" text-anchor="middle" fill="#20252b">Calculate lifecycle expenditure</text><path d="M170 209 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="225" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="244" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="248" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">5</text><text x="181" y="248" font-size="12" text-anchor="middle" fill="#20252b">Evaluate benefits and uncertainty</text><path d="M170 264 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="280" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="299" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="303" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">6</text><text x="181" y="303" font-size="12" text-anchor="middle" fill="#20252b">Assign ownership and conditions</text><path d="M170 319 v16 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="24" y="335" width="292" height="39" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><circle cx="47" cy="354" r="11" fill="#64748b" fill-opacity=".2"/><text x="47" y="358" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">7</text><text x="181" y="358" font-size="12" text-anchor="middle" fill="#20252b">Record the funding disposition</text><text x="170" y="402" font-size="10" text-anchor="middle" fill="#20252b">Outcome: business case, option ADR and benefits register</text></g></svg>
