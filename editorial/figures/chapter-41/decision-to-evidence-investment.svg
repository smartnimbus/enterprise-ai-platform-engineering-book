<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 342" role="img" aria-labelledby="title desc"><title id="title">Decision-to-evidence engineering applied to enterprise investment</title><desc id="desc">Six responsibilities from investment choice to lifecycle responsibility; feedback may invalidate the original business case.</desc><rect width="350" height="342" fill="white"/><g font-family="sans-serif"><rect x="20" y="5" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="21" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Decision</text><text x="175" y="36" font-size="9.5" text-anchor="middle" fill="#20252b">Select a defensible investment option</text><path d="M175 48 v10 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="20" y="59" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="75" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Accountability</text><text x="175" y="90" font-size="9.5" text-anchor="middle" fill="#20252b">Assign sponsor, service and outcome owners</text><path d="M175 102 v10 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="20" y="113" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="129" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Enforcement</text><text x="175" y="144" font-size="9.5" text-anchor="middle" fill="#20252b">Make funding and delivery conditions explicit</text><path d="M175 156 v10 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="20" y="167" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="183" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Verification</text><text x="175" y="198" font-size="9.5" text-anchor="middle" fill="#20252b">Compare actual results with approved assumptions</text><path d="M175 210 v10 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="20" y="221" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="237" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Evidence</text><text x="175" y="252" font-size="9.5" text-anchor="middle" fill="#20252b">Retain cost, demand and benefit records</text><path d="M175 264 v10 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="20" y="275" width="310" height="43" rx="4" fill="#64748b" fill-opacity=".075" stroke="#94a3b8"/><text x="175" y="291" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Lifecycle responsibility</text><text x="175" y="306" font-size="9.5" text-anchor="middle" fill="#20252b">Continue, correct, defer or discontinue investment</text><path d="M20 296 H7 V26 H20" stroke="#64748b" stroke-dasharray="4 3" fill="none"/><text x="175" y="334" font-size="10" text-anchor="middle" fill="#20252b">Changed evidence may invalidate the original business case.</text></g></svg>
