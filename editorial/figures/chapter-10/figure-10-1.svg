<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" role="img" aria-labelledby="title desc"><title id="title">Canonical Fabric responsibility model</title><desc id="desc">Four Structural Layers and eight cross-cutting Control Planes grouped as logical responsibilities, not physical deployment tiers or sequential execution.</desc><rect width="360" height="446" fill="white"/><g font-family="sans-serif"><text x="180" y="17" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Enterprise actors and use cases</text><rect x="12" y="29" width="336" height="35" rx="4" fill="#64748b" fill-opacity="0.05" stroke="#94a3b8"/><text x="180" y="50" font-size="11" text-anchor="middle" fill="#20252b">Business request · Agent task · Domain service</text><path d="M180 64 V82 m-4 -5 l4 5 l4 -5" stroke="#64748b" fill="none"/><rect x="12" y="85" width="336" height="154" rx="5" fill="#64748b" fill-opacity="0" stroke="#64748b"/><text x="180" y="101" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Four Structural Layers</text><rect x="22" y="109" width="316" height="27" rx="3" fill="#64748b" fill-opacity="0.09" stroke="#94a3b8"/><text x="29" y="126" font-size="10" text-anchor="start" fill="#20252b" font-weight="600">Execution Environment</text><text x="331" y="126" font-size="8.1" text-anchor="end" fill="#20252b">Compute, containment, resource boundaries</text><rect x="22" y="139" width="316" height="27" rx="3" fill="#64748b" fill-opacity="0.09" stroke="#94a3b8"/><text x="29" y="156" font-size="10" text-anchor="start" fill="#20252b" font-weight="600">Tooling</text><text x="331" y="156" font-size="8.1" text-anchor="end" fill="#20252b">Contracts, adapters and invocation</text><rect x="22" y="169" width="316" height="27" rx="3" fill="#64748b" fill-opacity="0.09" stroke="#94a3b8"/><text x="29" y="186" font-size="10" text-anchor="start" fill="#20252b" font-weight="600">Context</text><text x="331" y="186" font-size="8.1" text-anchor="end" fill="#20252b">Information admission, assembly and memory</text><rect x="22" y="199" width="316" height="27" rx="3" fill="#64748b" fill-opacity="0.09" stroke="#94a3b8"/><text x="29" y="216" font-size="10" text-anchor="start" fill="#20252b" font-weight="600">Lifecycle</text><text x="331" y="216" font-size="8.1" text-anchor="end" fill="#20252b">Harness, task coordination and resumption</text><path d="M70 239 V265 M180 239 V265 M290 239 V265" stroke="#64748b" fill="none" stroke-dasharray="4 3"/><text x="180" y="254" font-size="8.5" text-anchor="middle" fill="#20252b">Cross-cutting control relationships</text><rect x="12" y="265" width="336" height="136" rx="5" fill="#64748b" fill-opacity="0" stroke="#64748b"/><text x="180" y="281" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Eight Control Planes</text><rect x="22" y="290" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="100" y="304" font-size="10" text-anchor="middle" fill="#20252b">Identity</text><rect x="182" y="290" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="260" y="304" font-size="10" text-anchor="middle" fill="#20252b">Gateway</text><rect x="22" y="315" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="100" y="329" font-size="10" text-anchor="middle" fill="#20252b">Observability</text><rect x="182" y="315" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="260" y="329" font-size="10" text-anchor="middle" fill="#20252b">Verification</text><rect x="22" y="340" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="100" y="354" font-size="10" text-anchor="middle" fill="#20252b">Governance</text><rect x="182" y="340" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="260" y="354" font-size="10" text-anchor="middle" fill="#20252b">FinOps</text><rect x="22" y="365" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="100" y="379" font-size="10" text-anchor="middle" fill="#20252b">Data Protection</text><rect x="182" y="365" width="156" height="21" rx="3" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="260" y="379" font-size="10" text-anchor="middle" fill="#20252b">Interoperability</text><text x="180" y="423" font-size="9.5" text-anchor="middle" fill="#20252b">Logical responsibilities — not physical deployment tiers.</text><text x="180" y="437" font-size="9" text-anchor="middle" fill="#20252b">Structural Layer order does not represent execution sequence.</text></g></svg>
