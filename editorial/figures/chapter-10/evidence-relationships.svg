<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 348" role="img" aria-labelledby="title desc"><title id="title">Six related synthetic evidence records</title><desc id="desc">Explanatory ordering of six synthetic records, not one synchronous trace. Actual record links and event chronology remain authoritative.</desc><rect width="350" height="348" fill="white"/><g font-family="sans-serif"><rect x="15" y="5" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="22" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Context Manifest</text><text x="324" y="22" font-size="9" text-anchor="end" fill="#20252b">CM-001</text><text x="26" y="38" font-size="10" text-anchor="start" fill="#20252b">Admitted and excluded information</text><path d="M175 50 V60" stroke="#64748b" fill="none" stroke-dasharray="3 2"/><rect x="15" y="60" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="77" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Reconciliation Record</text><text x="324" y="77" font-size="9" text-anchor="end" fill="#20252b">RC-001</text><text x="26" y="93" font-size="10" text-anchor="start" fill="#20252b">Unresolved business status</text><path d="M175 105 V115" stroke="#64748b" fill="none" stroke-dasharray="3 2"/><rect x="15" y="115" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="132" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Delegation Record</text><text x="324" y="132" font-size="9" text-anchor="end" fill="#20252b">DG-001</text><text x="26" y="148" font-size="10" text-anchor="start" fill="#20252b">Bounded authority</text><path d="M175 160 V170" stroke="#64748b" fill="none" stroke-dasharray="3 2"/><rect x="15" y="170" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="187" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Authorisation Receipt</text><text x="324" y="187" font-size="9" text-anchor="end" fill="#20252b">AU-001</text><text x="26" y="203" font-size="10" text-anchor="start" fill="#20252b">DENY: scope and prerequisites</text><path d="M175 215 V225" stroke="#64748b" fill="none" stroke-dasharray="3 2"/><rect x="15" y="225" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="242" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Denied-Action Receipt</text><text x="324" y="242" font-size="9" text-anchor="end" fill="#20252b">DN-001</text><text x="26" y="258" font-size="10" text-anchor="start" fill="#20252b">No external call or financial mutation</text><path d="M175 270 V280" stroke="#64748b" fill="none" stroke-dasharray="3 2"/><rect x="15" y="280" width="320" height="45" rx="4" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8"/><text x="26" y="297" font-size="11" text-anchor="start" fill="#20252b" font-weight="600">Release-Gate Report</text><text x="324" y="297" font-size="9" text-anchor="end" fill="#20252b">RG-001</text><text x="26" y="313" font-size="10" text-anchor="start" fill="#20252b">FAIL — block promotion</text><text x="175" y="345" font-size="8.8" text-anchor="middle" fill="#20252b">Related records within the same synthetic case, not one synchronous trace.</text></g></svg>
