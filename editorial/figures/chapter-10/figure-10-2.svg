<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" role="img" aria-labelledby="title desc"><title id="title">Request, authority and evidence relationships</title><desc id="desc">Selected conceptual request, authority and evidence relationships. Mutable action admission precedes an external target. Denied actions have no external call; independent Verification assesses behaviour. Permit is hypothetical, not an observed Meridian refund.</desc><rect width="360" height="440" fill="white"/><g font-family="sans-serif"><defs><marker id="a10" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#64748b"/></marker></defs><rect x="110" y="8" width="140" height="32" rx="4" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="180" y="28" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Business request</text><path d="M180 40 V62" stroke="#64748b" fill="none" marker-end="url(#a10)"/><rect x="100" y="63" width="160" height="36" rx="4" fill="#64748b" fill-opacity="0.07" stroke="#94a3b8"/><text x="180" y="78" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Lifecycle / Harness</text><text x="180" y="91" font-size="8.5" text-anchor="middle" fill="#20252b">Coordinate task progress</text><rect x="8" y="65" width="78" height="32" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8"/><text x="47" y="85" font-size="10" text-anchor="middle" fill="#20252b">Identity</text><path d="M86 81 H100" stroke="#64748b" fill="none" stroke-dasharray="4 2" marker-end="url(#a10)"/><rect x="274" y="65" width="78" height="32" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8"/><text x="313" y="85" font-size="10" text-anchor="middle" fill="#20252b">Governance</text><path d="M274 81 H260" stroke="#64748b" fill="none" stroke-dasharray="4 2" marker-end="url(#a10)"/><path d="M180 99 V115 H75 V134 M180 115 H285 V134" stroke="#64748b" fill="none" marker-end="url(#a10)"/><rect x="8" y="135" width="134" height="64" rx="4" fill="#64748b" fill-opacity="0.06" stroke="#94a3b8"/><text x="75" y="150" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Context</text><text x="75" y="165" font-size="9" text-anchor="middle" fill="#20252b">Source access check</text><text x="75" y="177" font-size="9" text-anchor="middle" fill="#20252b">Context admission</text><text x="75" y="190" font-size="9" text-anchor="middle" fill="#20252b">Conflict handling</text><rect x="218" y="135" width="134" height="64" rx="4" fill="#64748b" fill-opacity="0.06" stroke="#94a3b8"/><text x="285" y="150" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Tooling</text><text x="285" y="165" font-size="9" text-anchor="middle" fill="#20252b">Proposed action</text><text x="285" y="177" font-size="9" text-anchor="middle" fill="#20252b">Invocation contract</text><text x="285" y="190" font-size="9" text-anchor="middle" fill="#20252b">External mutation</text><path d="M142 167 H155 V117 H180" stroke="#64748b" fill="none" marker-end="url(#a10)"/><path d="M285 199 V220" stroke="#64748b" fill="none" marker-end="url(#a10)"/><rect x="218" y="220" width="134" height="41" rx="4" fill="#64748b" fill-opacity="0.13" stroke="#94a3b8"/><text x="285" y="236" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Gateway PEP</text><text x="285" y="251" font-size="9" text-anchor="middle" fill="#20252b">Mandatory admission</text><path d="M285 261 V280 H225 V298 M285 280 H319 V298" stroke="#64748b" fill="none" marker-end="url(#a10)"/><text x="233" y="289" font-size="8.5" text-anchor="start" fill="#15803d">Permit</text><text x="319" y="289" font-size="8.5" text-anchor="start" fill="#b45353">Deny</text><rect x="188" y="299" width="74" height="34" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8"/><text x="225" y="313" font-size="9" text-anchor="middle" fill="#20252b">External</text><text x="225" y="325" font-size="9" text-anchor="middle" fill="#20252b">target</text><rect x="283" y="299" width="69" height="34" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8"/><text x="317.5" y="313" font-size="9" text-anchor="middle" fill="#20252b">No external</text><text x="317.5" y="325" font-size="9" text-anchor="middle" fill="#20252b">action</text><rect x="8" y="220" width="134" height="68" rx="4" fill="#64748b" fill-opacity="0.06" stroke="#94a3b8"/><text x="75" y="236" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Evidence</text><text x="75" y="251" font-size="9" text-anchor="middle" fill="#20252b">Context and authority</text><text x="75" y="263" font-size="9" text-anchor="middle" fill="#20252b">Action disposition</text><text x="75" y="275" font-size="9" text-anchor="middle" fill="#20252b">Correlated records</text><path d="M75 199 V220 M218 241 H142" stroke="#64748b" fill="none" stroke-dasharray="2 3" marker-end="url(#a10)"/><path d="M75 288 V355" stroke="#64748b" fill="none" stroke-dasharray="2 3" marker-end="url(#a10)"/><rect x="8" y="356" width="344" height="40" rx="4" fill="#64748b" fill-opacity="0.09" stroke="#94a3b8"/><text x="180" y="372" font-size="11" text-anchor="middle" fill="#20252b" font-weight="600">Verification</text><text x="180" y="387" font-size="9.5" text-anchor="middle" fill="#20252b">Assess behaviour and enforcement independently</text><path d="M15 414 H35" stroke="#64748b" fill="none"/><text x="40" y="417" font-size="8.5" text-anchor="start" fill="#20252b">Request/action</text><path d="M128 414 H148" stroke="#64748b" fill="none" stroke-dasharray="4 2"/><text x="153" y="417" font-size="8.5" text-anchor="start" fill="#20252b">Authority/control</text><path d="M263 414 H283" stroke="#64748b" fill="none" stroke-dasharray="2 3"/><text x="288" y="417" font-size="8.5" text-anchor="start" fill="#20252b">Evidence</text><text x="180" y="434" font-size="8.5" text-anchor="middle" fill="#20252b">Conceptual interaction view; not a recorded execution trace.</text></g></svg>
