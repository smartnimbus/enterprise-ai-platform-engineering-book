<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 292" role="img" aria-labelledby="title desc"><title id="title">Missing architectural bridge</title><desc id="desc">Chapter 10 connects Chapter 1's investment rationale to Chapters 13 and 16 and the Decision Atlas.</desc><rect width="350" height="292" fill="white"/><g font-family="sans-serif"><rect x="65" y="7" width="220" height="48" rx="5" fill="#64748b" fill-opacity="0.1" stroke="#94a3b8"/><text x="175" y="26" font-size="13" text-anchor="middle" fill="#20252b" font-weight="600">Chapter 1</text><text x="175" y="42" font-size="10" text-anchor="middle" fill="#20252b">Why shared capabilities may be justified</text><path d="M175 55 V80" stroke="#64748b" fill="none"/><rect x="40" y="80" width="270" height="58" rx="5" fill="#64748b" fill-opacity="0.16" stroke="#20252b"/><text x="175" y="98" font-size="10" text-anchor="middle" fill="#20252b">MISSING MANUSCRIPT BRIDGE</text><text x="175" y="116" font-size="14" text-anchor="middle" fill="#20252b" font-weight="600">Chapter 10</text><text x="175" y="130" font-size="10" text-anchor="middle" fill="#20252b">How the complete architecture fits together</text><path d="M175 138 V158 H87 V176 M175 158 H263 V176" stroke="#64748b" fill="none"/><rect x="7" y="176" width="160" height="51" rx="5" fill="#64748b" fill-opacity="0.06" stroke="#94a3b8"/><text x="87" y="195" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Chapter 13</text><text x="87" y="212" font-size="10" text-anchor="middle" fill="#20252b">Context mechanisms</text><rect x="183" y="176" width="160" height="51" rx="5" fill="#64748b" fill-opacity="0.06" stroke="#94a3b8"/><text x="263" y="195" font-size="12" text-anchor="middle" fill="#20252b" font-weight="600">Chapter 16</text><text x="263" y="212" font-size="10" text-anchor="middle" fill="#20252b">Gateway enforcement</text><path d="M87 227 V242 H175 M263 227 V242 H175 V252" stroke="#64748b" fill="none"/><rect x="65" y="252" width="220" height="34" rx