<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 290" role="img" aria-labelledby="title desc"><title id="title">Domain-local delivery compared with selective capability sharing.</title><desc id="desc">Two use cases initially provide their own identity, integration, verification and evidence capabilities. In the shared alternative, equivalent capabilities are provided through a common service while domain-specific business logic remains local.</desc><rect width="350" height="290" fill="#fff"/><g font-family="sans-serif" fill="#20252b"><text x="82" y="17" font-size="11" text-anchor="middle" font-weight="600">Domain-local delivery</text><text x="267" y="17" font-size="11" text-anchor="middle" font-weight="600">Shared delivery</text><rect x="5" y="31" width="76" height="179" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="49" font-size="10" text-anchor="middle">Use case A</text><rect x="10" y="58" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.05" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="73" font-size="9" text-anchor="middle">Domain logic</text><rect x="10" y="87" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="102" font-size="9" text-anchor="middle">Identity</text><rect x="10" y="116" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="131" font-size="9" text-anchor="middle">Integration</text><rect x="10" y="145" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="160" font-size="9" text-anchor="middle">Verification</text><rect x="10" y="174" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="43" y="189" font-size="9" text-anchor="middle">Evidence</text><rect x="193" y="31" width="73" height="58" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8" stroke-width=".7"/><text x="229.5" y="50" font-size="10" text-anchor="middle">Use case A</text><rect x="197" y="58" width="65" height="24" rx="3" fill="#64748b" fill-opacity="0.05" stroke="#94a3b8" stroke-width=".7"/><text x="229.5" y="73" font-size="9" text-anchor="middle">Domain logic</text><path d="M229.5 89 V116 m-3 -4 l3 4 l3 -4" fill="none" stroke="#64748b" stroke-width="1"/><rect x="86" y="31" width="76" height="179" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="49" font-size="10" text-anchor="middle">Use case B</text><rect x="91" y="58" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.05" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="73" font-size="9" text-anchor="middle">Domain logic</text><rect x="91" y="87" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="102" font-size="9" text-anchor="middle">Identity</text><rect x="91" y="116" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="131" font-size="9" text-anchor="middle">Integration</text><rect x="91" y="145" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="160" font-size="9" text-anchor="middle">Verification</text><rect x="91" y="174" width="66" height="24" rx="3" fill="#64748b" fill-opacity="0.16" stroke="#94a3b8" stroke-width=".7"/><text x="124" y="189" font-size="9" text-anchor="middle">Evidence</text><rect x="272" y="31" width="73" height="58" rx="3" fill="#64748b" fill-opacity="0" stroke="#94a3b8" stroke-width=".7"/><text x="308.5" y="50" font-size="10" text-anchor="middle">Use case B</text><rect x="276" y="58" width="65" height="24" rx="3" fill="#64748b" fill-opacity="0.05" stroke="#94a3b8" stroke-width=".7"/><text x="308.5" y="73" font-size="9" text-anchor="middle">Domain logic</text><path d="M308.5 89 V116 m-3 -4 l3 4 l3 -4" fill="none" stroke="#64748b" stroke-width="1"/><path d="M169 120 H188 m-5 -4 l5 4 l-5 4" fill="none" stroke="#64748b" stroke-width="1"/><rect x="193" y="117" width="152" height="93" rx="3" fill="#64748b" fill-opacity="0.11" stroke="#94a3b8" stroke-width=".7"/><text x="269" y="134" font-size="10" text-anchor="middle">Identity integration</text><path d="M200 141 H338" fill="none" stroke="#64748b" stroke-width="1"/><text x="269" y="155" font-size="10" text-anchor="middle">Tool integration</text><path d="M200 162 H338" fill="none" stroke="#64748b" stroke-width="1"/><text x="269" y="176" font-size="10" text-anchor="middle">Verification</text><path d="M200 183 H338" fill="none" stroke="#64748b" stroke-width="1"/><text x="269" y="197" font-size="10" text-anchor="middle">Operational evidence</text><text x="82" y="230" font-size="9" text-anchor="middle">Independent capabilities</text><text x="82" y="244" font-size="9" text-anchor="middle">and local ownership</text><text x="269" y="230" font-size="9" text-anchor="middle">Equivalent common capabilities</text><text x="269" y="244" font-size="9" text-anchor="middle">with explicit service ownership</text><text x="175" y="278" font-size="10" text-anchor="middle" font-weight="600">Shared investment is a decision, not an assumption.</text></g></svg>
