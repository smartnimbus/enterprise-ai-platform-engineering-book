<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" role="img" aria-labelledby="title desc"><title id="title">Decision-to-evidence engineering applied to shared capability investment.</title><desc id="desc">An architectural decision identifies accountable owners, effective implementation boundaries, verification activities and supporting evidence. A feedback path returns the resulting observations to the original decision when circumstances change.</desc><rect width="350" height="350" fill="#fff"/><g font-family="sans-serif" fill="#20252b"><rect x="20" y="5" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="21" font-size="12" text-anchor="middle" font-weight="600">Decision</text><text x="175" y="36" font-size="9.5" text-anchor="middle">Evaluate shared or independent delivery</text><path d="M175 48 v12 m-4 -5 l4 5 l4 -5" fill="none" stroke="#64748b" stroke-width="1"/><rect x="20" y="61" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="77" font-size="12" text-anchor="middle" font-weight="600">Accountability</text><text x="175" y="92" font-size="9.5" text-anchor="middle">Identify the investment and service owners</text><path d="M175 104 v12 m-4 -5 l4 5 l4 -5" fill="none" stroke="#64748b" stroke-width="1"/><rect x="20" y="117" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="133" font-size="12" text-anchor="middle" font-weight="600">Enforcement</text><text x="175" y="148" font-size="9.5" text-anchor="middle">Make agreed boundaries effective in delivery</text><path d="M175 160 v12 m-4 -5 l4 5 l4 -5" fill="none" stroke="#64748b" stroke-width="1"/><rect x="20" y="173" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="189" font-size="12" text-anchor="middle" font-weight="600">Verification</text><text x="175" y="204" font-size="9.5" text-anchor="middle">Compare actual behaviour and costs with expectations</text><path d="M175 216 v12 m-4 -5 l4 5 l4 -5" fill="none" stroke="#64748b" stroke-width="1"/><rect x="20" y="229" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="245" font-size="12" text-anchor="middle" font-weight="600">Evidence</text><text x="175" y="260" font-size="9.5" text-anchor="middle">Retain records supporting the conclusion</text><path d="M175 272 v12 m-4 -5 l4 5 l4 -5" fill="none" stroke="#64748b" stroke-width="1"/><rect x="20" y="285" width="310" height="43" rx="3" fill="#64748b" fill-opacity="0.075" stroke="#94a3b8" stroke-width=".7"/><text x="175" y="301" font-size="12" text-anchor="middle" font-weight="600">Lifecycle responsibility</text><text x="175" y="316" font-size="9.5" text-anchor="middle">Revisit the decision when assumptions change</text><path d="M20 306 H7 V26 H20 m-5 -4 l5 4 l-5 4" stroke="#64748b" stroke-dasharray="4 3" fill="none"/><text x="175" y="346" font-size="9.5" text-anchor="middle">Evidence may require the original choice to change.</text></g></svg>
