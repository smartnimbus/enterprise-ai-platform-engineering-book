<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-labelledby="title desc"><title id="title">Seven-step investment appraisal</title><desc id="desc">Seven steps, return to relevant step for missing evidence, proceed defer or reject, four resulting records.</desc><rect width="420" height="460" fill="white"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#475569"/></marker></defs><g font-family="sans-serif" fill="#20252b"><rect x="12" y="8" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="31" text-anchor="middle" font-size="12">1. Confirm funded demand</text><path d="M182 44 V57" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="57" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="80" text-anchor="middle" font-size="12">2. Establish equivalent requirements</text><path d="M182 93 V106" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="106" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="129" text-anchor="middle" font-size="12">3. Identify eligible alternatives</text><path d="M182 142 V155" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="155" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="178" text-anchor="middle" font-size="12">4. Calculate lifecycle expenditure</text><path d="M182 191 V204" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="204" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="227" text-anchor="middle" font-size="12">5. Evaluate benefits and uncertainty</text><path d="M182 240 V253" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="253" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="276" text-anchor="middle" font-size="12">6. Assign ownership and funding conditions</text><path d="M182 289 V302" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="302" width="340" height="36" rx="4" fill="#f4f5f7" stroke="#475569"/><text x="182" y="325" text-anchor="middle" font-size="12">7. Record funding disposition</text><path d="M352 320 H390 V26 H352" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="403" y="172" transform="rotate(-90 403 172)" font-size="10" text-anchor="middle">Return to relevant step for missing evidence</text><path d="M182 338 V350 H65 M182 350 H299" stroke="#475569" fill="none"/><path d="M65 350 V363" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="363" width="106" height="30" rx="4" fill="#eaf5f3" stroke="#475569"/><text x="65" y="382" text-anchor="middle" font-size="12" font-weight="600">Proceed</text><path d="M65 393 V408" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M182 350 V363" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="129" y="363" width="106" height="30" rx="4" fill="#fff8ec" stroke="#475569"/><text x="182" y="382" text-anchor="middle" font-size="12" font-weight="600">Defer</text><path d="M182 393 V408" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M299 350 V363" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="246" y="363" width="106" height="30" rx="4" fill="#fdf0ec" stroke="#475569"/><text x="299" y="382" text-anchor="middle" font-size="12" font-weight="600">Reject</text><path d="M299 393 V408" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="12" y="408" width="340" height="42" rx="4" fill="white" stroke="#475569"/><text x="182" y="425" text-anchor="middle" font-size="11">Business Case · Option ADR</text><text x="182" y="440" text-anchor="middle" font-size="11">Benefits Register · Funding Decision Record</text></g></svg>